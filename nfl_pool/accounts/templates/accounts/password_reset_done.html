{% extends "pool/base.html" %}

{% block title %}Reset Password — NFL Pool{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <h2 class="card-title mb-3">Check your email</h2>
        <p class="text-muted mb-0">
          If an account exists with that email, we've sent a link to reset your password.
        </p>
        <hr>
        <a href="{% url 'accounts:home' %}">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
