{% extends "pool/base.html" %}

{% block title %}Reset Password — NFL Pool{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <h2 class="card-title mb-3">Password changed</h2>
        <p class="text-muted mb-4">Your password has been set. You can log in now.</p>
        <a href="{% url 'accounts:home' %}" class="btn btn-dark btn-lg">Log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
